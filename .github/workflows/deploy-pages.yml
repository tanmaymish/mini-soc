name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

# Publish to the gh-pages branch (classic branch-based Pages pipeline).
# This is more reliable than the Actions deployment API, which rate-limits
# republishes ("Deployment failed, try again later") under frequent deploys.
permissions:
  contents: write

concurrency:
  group: pages-ghbranch
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (demo mode)
        working-directory: frontend
        run: npm run build
        env:
          VITE_DEMO_MODE: "true"
          # Pages serves under /<repo>/ (trailing slash required by Vite).
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/"

      - name: SPA 404 fallback + disable Jekyll
        working-directory: frontend
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
